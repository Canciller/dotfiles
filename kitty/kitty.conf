allow_remote_control yes
listen_on unix:/tmp/mykitty

font_family Hasklug Nerd Font Mono
font_size 12
disable_ligatures never
macos_thicken_font 0

enable_audio_bell no

# background_opacity 0.75
# background_blur 32

tab_bar_edge top
tab_bar_margin_width 2
tab_bar_margin_height 5 0
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

macos_quit_when_last_window_closed yes

map cmd+n new_os_window_with_cwd
map ctrl+shift+w new_os_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map cmd+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map cmd+enter new_window_with_cwd

clipboard_control write-clipboard write-primary read-clipboard read-primary

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME


# Left Option acts as Alt (fzf Alt-C etc.); right Option still types accents
macos_option_as_alt left
